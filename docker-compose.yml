services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: minecraft-fabric
    restart: unless-stopped
    ports:
      - "${PORT:-25565}:25565"
    environment:
      # Accept the Minecraft EULA (required)
      EULA: "TRUE"

      # Fabric server for the Minecraft version set below (26.x requires Java 25)
      TYPE: FABRIC
      VERSION: ${VERSION:-26.1.2}

      # RAM and JVM tuning
      MEMORY: ${MEMORY:-4G}
      USE_AIKAR_FLAGS: "true"

      # Gameplay settings (override in .env)
      MOTD: ${MOTD:-Minecraft 26.1.2 + Fabric}
      DIFFICULTY: ${DIFFICULTY:-normal}
      MODE: ${MODE:-survival}
      MAX_PLAYERS: ${MAX_PLAYERS:-20}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-8}
      PVP: ${PVP:-true}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      ENABLE_WHITELIST: ${ENABLE_WHITELIST:-FALSE}
      TZ: ${TZ:-Etc/UTC}

    volumes:
      # World, configs and libraries
      - ./data:/data
      # Drop .jar mods here, then: docker compose restart
      - ./mods:/data/mods
    stdin_open: true
    tty: true
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
